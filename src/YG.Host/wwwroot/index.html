<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>YG Workflow Console</title>
<style>
:root {
  --bg: #0b0e14;
  --bg-soft: #10141d;
  --card: #151a24;
  --card-2: #1a2130;
  --line: #232b3a;
  --text: #e6e9ef;
  --muted: #8b93a5;
  --primary: #4f8cff;
  --primary-strong: #3b74e0;
  --ok: #34d399;
  --warn: #fbbf24;
  --danger: #f87171;
  --code-bg: #0d1420;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}
code { background: var(--code-bg); border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px; font-size: 12px; color: #9fc1ff; }
pre { background: var(--code-bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; overflow: auto; font-size: 12px; color: #c9d4e5; max-height: 260px; }
h1,h2,h3,h4 { margin: 0 0 8px; font-weight: 600; }
h2 { font-size: 18px; } h3 { font-size: 16px; } h4 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
.muted { color: var(--muted); }
.small { font-size: 12px; }

/* shell */
.shell header {
  display: flex; align-items: center; gap: 14px;
  padding: 10px 20px;
  background: var(--bg-soft);
  border-bottom: 1px solid var(--line);
  position: sticky; top: 0; z-index: 5;
}
.shell main { max-width: 1100px; margin: 0 auto; padding: 20px; }
.spacer { flex: 1; }
.logo {
  width: 44px; height: 44px; border-radius: 10px;
  background: linear-gradient(135deg, var(--primary), #7c5cff);
  color: #fff; font-weight: 700; display: flex; align-items: center; justify-content: center;
}
.logo.small { width: 32px; height: 32px; border-radius: 8px; font-size: 13px; }
nav { display: flex; gap: 4px; }
.tab {
  background: none; border: none; color: var(--muted); font: inherit;
  padding: 6px 12px; border-radius: 8px; cursor: pointer;
}
.tab:hover { color: var(--text); background: var(--card); }
.tab.active { color: var(--text); background: var(--card-2); }

/* cards */
.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 16px;
  margin-bottom: 16px;
}
.card.empty { text-align: center; color: var(--muted); padding: 32px; }
.card.empty.tall { padding: 48px 32px; }
.table-card { padding: 0; overflow: hidden; }
.table-wrap { overflow: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; color: var(--muted); font-weight: 500; font-size: 12px; padding: 10px 14px; border-bottom: 1px solid var(--line); }
td { padding: 10px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tr:last-child td { border-bottom: none; }
tbody tr:hover { background: var(--card-2); }
td.actions, th.actions { text-align: right; white-space: nowrap; }
.data-cell { max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; color: var(--muted); }

/* buttons & inputs */
.btn {
  font: inherit; border-radius: 8px; cursor: pointer;
  padding: 8px 14px; border: 1px solid var(--line);
  background: var(--card-2); color: var(--text);
}
.btn:hover { border-color: #33405a; }
.btn:disabled { opacity: .5; cursor: default; }
.btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
.btn.primary:hover:not(:disabled) { background: var(--primary-strong); }
.btn.ghost { background: transparent; }
.btn.danger { background: transparent; border-color: var(--danger); color: var(--danger); }
.btn.danger:hover:not(:disabled) { background: rgba(248,113,113,.12); }
.btn.warn { background: transparent; border-color: var(--warn); color: var(--warn); }
.btn.warn:hover:not(:disabled) { background: rgba(251,191,36,.12); }
.btn.small { padding: 4px 10px; font-size: 12px; }
label { display: block; margin: 10px 0 4px; font-size: 12px; color: var(--muted); }
input, textarea, select {
  width: 100%; margin-top: 4px;
  background: var(--bg-soft); color: var(--text);
  border: 1px solid var(--line); border-radius: 8px;
  padding: 8px 10px; font: inherit;
}
input:focus, textarea:focus, select:focus { outline: none; border-color: var(--primary); }
select option { background: var(--bg-soft); color: var(--text); }
textarea.doc { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 12px; }
label.check { display: flex; align-items: center; gap: 6px; margin: 0; }
label.check input { width: auto; margin: 0; }

/* badges */
.badge {
  display: inline-block; padding: 2px 9px; border-radius: 999px;
  font-size: 11px; font-weight: 600; letter-spacing: .02em;
  background: var(--card-2); color: var(--muted); border: 1px solid var(--line);
}
.badge-open { color: var(--primary); border-color: rgba(79,140,255,.4); background: rgba(79,140,255,.1); }
.badge-claimed { color: var(--warn); border-color: rgba(251,191,36,.4); background: rgba(251,191,36,.08); }
.badge-completed, .badge-published { color: var(--ok); border-color: rgba(52,211,153,.4); background: rgba(52,211,153,.08); }
.badge-running, .badge-active { color: #9fc1ff; border-color: rgba(159,193,255,.35); background: rgba(159,193,255,.08); }
.badge-pended, .badge-rejected { color: var(--danger); border-color: rgba(248,113,113,.4); background: rgba(248,113,113,.08); }
.badge-draft { color: var(--muted); }
.badge-pendingapproval { color: var(--warn); border-color: rgba(251,191,36,.4); background: rgba(251,191,36,.08); }

/* breadcrumbs */
.crumbs-card { padding: 14px 16px; }
.crumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.crumb {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 14px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--card-2);
  color: var(--muted); font-size: 13px; white-space: nowrap;
}
.crumb-kind { font-size: 12px; }
.crumb.done { color: var(--ok); border-color: rgba(52,211,153,.45); background: rgba(52,211,153,.08); }
.crumb.current {
  color: #fff; background: var(--primary); border-color: var(--primary);
  font-weight: 600;
  box-shadow: 0 0 0 3px rgba(79,140,255,.25);
}
.crumb.pended { color: var(--danger); border-color: rgba(248,113,113,.45); background: rgba(248,113,113,.08); }
.crumb.active { color: #9fc1ff; border-color: rgba(159,193,255,.4); }
.crumb-sep { color: var(--muted); }

/* layout bits */
.view-head { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
.view-head h2 { margin: 0; flex: none; }
.view-head .check { margin-left: auto; }
.task-grid { display: grid; grid-template-columns: 1.4fr 1fr; gap: 16px; align-items: start; }
.def-grid { display: grid; grid-template-columns: 1.1fr 1fr; gap: 16px; align-items: start; }
@media (max-width: 900px) { .task-grid, .def-grid { grid-template-columns: 1fr; } }
.kv { display: flex; justify-content: space-between; gap: 12px; padding: 6px 0; border-bottom: 1px dashed var(--line); font-size: 13px; }
.kv:last-of-type { border-bottom: none; }
.kv-row { display: grid; grid-template-columns: 1fr 1.4fr auto; gap: 8px; margin-top: 8px; }
.row-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; margin: 6px 0; }
.seg-btn { font: inherit; font-size: 12px; padding: 6px 12px; background: transparent; color: var(--muted); border: none; cursor: pointer; }
.seg-btn.active { background: var(--primary); color: #fff; }
.start-row { display: grid; grid-template-columns: 1fr 1fr auto; gap: 12px; align-items: end; }
@media (max-width: 700px) { .start-row { grid-template-columns: 1fr; } }
.recent { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.steps { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; margin-bottom: 12px; }
.step-card { background: var(--card-2); border: 1px solid var(--line); border-radius: 8px; padding: 10px; }
.step-title { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.detail-head { margin-bottom: 12px; }
.pended-card { border-color: rgba(251,191,36,.4); }
.validation-card { border-color: rgba(248,113,113,.5); }
.validation-card ul { margin: 6px 0; padding-left: 20px; color: var(--danger); }
.reject-card { border-color: rgba(248,113,113,.4); }
.complete-form { margin-top: 14px; border-top: 1px solid var(--line); padding-top: 12px; }

/* login */
.login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; }
.login-card { width: 340px; text-align: center; padding: 28px; }
.login-card h1 { font-size: 20px; margin: 12px 0 4px; }
.login-card .logo { margin: 0 auto; }
.login-card label { text-align: left; }
.login-card .btn { width: 100%; margin-top: 18px; }

/* toasts */
.toasts { position: fixed; top: 16px; right: 16px; z-index: 50; display: flex; flex-direction: column; gap: 8px; max-width: 380px; }
.toast {
  padding: 10px 14px; border-radius: 10px; font-size: 13px; cursor: pointer;
  background: var(--card-2); border: 1px solid var(--danger); color: var(--danger);
  box-shadow: 0 8px 24px rgba(0,0,0,.5);
}
.toast.ok { border-color: var(--ok); color: var(--ok); }
.note-composer { display: flex; gap: 8px; margin-top: 12px; }
.note-composer input { flex: 1; }
tr.note-row td { background: rgba(79, 140, 255, 0.07); }
.note-text { font-style: italic; }
.note-item { margin: 6px 0; }
.crumb-mark { margin-left: 4px; color: var(--warn); font-weight: 600; }
.crumb-runs { margin-left: 4px; font-size: 11px; color: var(--muted); background: var(--card-2); border: 1px solid var(--line); border-radius: 8px; padding: 0 5px; }
.lineage { display: flex; gap: 8px; align-items: center; margin-top: 6px; flex-wrap: wrap; }
.mode-tabs { display: flex; gap: 6px; margin-bottom: 10px; }
.builder h4 { margin: 14px 0 6px; }
.builder > label { display: block; max-width: 260px; }
.step-editor { padding: 10px 12px; margin: 8px 0; background: var(--card-2); }
.step-editor-head { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.step-editor-head .step-id { flex: 1; min-width: 110px; font-family: ui-monospace, monospace; }
.field-row { display: flex; gap: 6px; margin-top: 8px; align-items: flex-end; flex-wrap: wrap; }
.field-row label { flex: 1; min-width: 140px; }
.settings { margin-top: 8px; }
.transition-row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-bottom: 6px; }
.transition-row .cond-field { width: 160px; }
.transition-row .cond-value { width: 90px; }
.when { display: flex; align-items: center; gap: 4px; white-space: nowrap; }
.row-tools { margin-left: auto; display: flex; gap: 4px; }
.lint { border: 1px solid var(--warn); border-radius: 10px; padding: 8px 12px; margin-top: 10px; }
.lint ul { margin: 6px 0 2px 18px; }
.json-preview { margin-top: 10px; }
.json-preview pre { max-height: 260px; overflow: auto; }
</style>
</head>
