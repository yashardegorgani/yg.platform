<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>YG Workflow Console</title>
<style>
:root {
  --bg: #f5f6f8;
  --card: #ffffff;
  --text: #16181d;
  --muted: #6b7280;
  --line: #e5e7eb;
  --primary: #2563eb;
  --primary-h: #1d4ed8;
  --danger: #dc2626;
  --radius: 10px;
  --shadow: 0 1px 3px rgba(16, 24, 40, 0.08), 0 1px 2px rgba(16, 24, 40, 0.04);
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
}

h1, h2, h3, h4 { margin: 0 0 10px; }
h2 { font-size: 20px; }
h4 { font-size: 14px; margin-top: 18px; }

code {
  font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
  font-size: 12.5px;
  background: #eef1f4;
  padding: 1px 5px;
  border-radius: 5px;
}

pre {
  background: #0f172a;
  color: #e2e8f0;
  padding: 12px;
  border-radius: 8px;
  overflow: auto;
  font-size: 12.5px;
  margin: 6px 0 12px;
}

.muted { color: var(--muted); }
.small { font-size: 12.5px; }
.spacer { flex: 1; }

.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 16px;
  margin-bottom: 16px;
}

.card.empty { text-align: center; color: var(--muted); padding: 32px; }
.card.empty.tall { padding: 48px 32px; }
.card.table-card { padding: 4px 8px; }

/* ---------- buttons ---------- */
.btn {
  border: 1px solid transparent;
  border-radius: 8px;
  padding: 8px 14px;
  font: inherit;
  cursor: pointer;
  transition: background 0.15s, border-color 0.15s;
}
.btn.small { padding: 4px 10px; font-size: 12.5px; }
.btn.primary { background: var(--primary); color: #fff; }
.btn.primary:hover { background: var(--primary-h); }
.btn.primary:disabled { background: #93b4f5; cursor: default; }
.btn.ghost { background: transparent; border-color: var(--line); color: var(--text); }
.btn.ghost:hover { background: #f1f3f6; }
.btn.danger { background: var(--danger); color: #fff; }
.btn.danger:disabled { background: #eea8a8; cursor: default; }

/* ---------- login ---------- */
.login-wrap {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}
.login-card {
  width: 340px;
  padding: 32px;
  text-align: center;
}
.login-card h1 { font-size: 20px; }
.login-card label { display: block; text-align: left; margin: 12px 0 0; font-size: 12.5px; color: var(--muted); }
.login-card input {
  width: 100%;
  margin-top: 4px;
}
.login-card .btn { width: 100%; margin-top: 20px; }

.logo {
  width: 48px; height: 48px;
  margin: 0 auto 12px;
  border-radius: 12px;
  background: linear-gradient(135deg, #2563eb, #7c3aed);
  color: #fff;
  font-weight: 700;
  font-size: 18px;
  display: flex; align-items: center; justify-content: center;
}
.logo.small { width: 32px; height: 32px; font-size: 13px; margin: 0; border-radius: 8px; }

/* ---------- inputs ---------- */
input, textarea {
  font: inherit;
  color: var(--text);
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 8px 10px;
  outline: none;
}
input:focus, textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12); }
textarea { width: 100%; resize: vertical; }
textarea.doc { font-family: ui-monospace, "Cascadia Code", Consolas, monospace; font-size: 12.5px; line-height: 1.45; }

label { display: block; margin-bottom: 10px; font-size: 13px; }
label input { display: block; width: 100%; margin-top: 4px; }
label.check { display: flex; align-items: center; gap: 6px; margin: 0; }
label.check input { width: auto; margin: 0; }

/* ---------- shell ---------- */
.shell header {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 10px 24px;
  background: var(--card);
  border-bottom: 1px solid var(--line);
  position: sticky;
  top: 0;
  z-index: 10;
}
.shell nav { display: flex; gap: 4px; }
.tab {
  border: none;
  background: transparent;
  font: inherit;
  padding: 8px 14px;
  border-radius: 8px;
  cursor: pointer;
  color: var(--muted);
}
.tab:hover { background: #f1f3f6; color: var(--text); }
.tab.active { background: #e8efff; color: var(--primary); font-weight: 600; }

.shell main {
  max-width: 1200px;
  margin: 24px auto;
  padding: 0 24px;
}

.view-head {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 14px;
}
.view-head h2 { margin: 0; flex: 1; }

/* ---------- tables ---------- */
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
th { font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); font-weight: 600; }
tbody tr:last-child td { border-bottom: none; }
td.actions, th.actions { text-align: right; white-space: nowrap; }
td.actions .btn { margin-left: 6px; }
td.data-cell { font-family: ui-monospace, Consolas, monospace; font-size: 12px; max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.table-wrap { overflow-x: auto; }

tr.expand-row td { background: #f8fafc; }

/* ---------- badges ---------- */
.badge {
  display: inline-block;
  padding: 2px 10px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 600;
}
.badge-draft { background: #f1f5f9; color: #475569; }
.badge-pendingapproval { background: #fef3c7; color: #b45309; }
.badge-published { background: #dcfce7; color: #15803d; }
.badge-open { background: #dbeafe; color: #1d4ed8; }
.badge-claimed { background: #fef3c7; color: #b45309; }
.badge-completed { background: #dcfce7; color: #15803d; }
.badge-running { background: #dbeafe; color: #1d4ed8; }

/* ---------- tasks ---------- */
.complete-form { padding: 8px 4px; }
.kv-row {
  display: grid;
  grid-template-columns: 1fr 2fr auto;
  gap: 8px;
  margin-top: 8px;
}
.row-actions {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  margin-top: 12px;
}

/* ---------- definitions ---------- */
.def-grid {
  display: grid;
  grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr);
  gap: 16px;
  align-items: start;
}
@media (max-width: 900px) { .def-grid { grid-template-columns: 1fr; } }

.validation-card { border-color: #fecaca; background: #fef2f2; }
.validation-card h4 { color: #b91c1c; margin-top: 0; }
.validation-card ul { margin: 8px 0; padding-left: 20px; }
.validation-card li { margin: 4px 0; }

.reject-card { border-color: #fde68a; background: #fffbeb; }
.reject-card h4 { margin-top: 0; }
.reject-card textarea { margin-top: 4px; }

/* ---------- instances ---------- */
.start-card h4 { margin-top: 0; }
.start-row {
  display: flex;
  gap: 12px;
  align-items: flex-end;
  flex-wrap: wrap;
}
.start-row label { flex: 1; min-width: 180px; margin: 0; }
.start-row .btn { height: 37px; }
.recent { margin-top: 12px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }

.detail-head { margin-bottom: 8px; }
.steps {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 10px;
  margin-bottom: 8px;
}
.step-card {
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 10px 12px;
  background: #fafbfc;
}
.step-card .step-title { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 6px; }
.step-card pre { margin: 6px 0; padding: 8px; font-size: 11.5px; }

/* ---------- toasts ---------- */
.toasts {
  position: fixed;
  top: 16px;
  right: 16px;
  z-index: 100;
  display: flex;
  flex-direction: column;
  gap: 8px;
  max-width: 420px;
}
.toast {
  padding: 12px 16px;
  border-radius: 10px;
  box-shadow: 0 4px 12px rgba(16, 24, 40, 0.15);
  cursor: pointer;
  font-size: 13px;
  animation: slide-in 0.2s ease-out;
}
.toast.error { background: #fef2f2; border: 1px solid #fecaca; color: #b91c1c; }
.toast.ok { background: #f0fdf4; border: 1px solid #bbf7d0; color: #15803d; }
.toast div + div { margin-top: 4px; }

@keyframes slide-in {
  from { transform: translateX(24px); opacity: 0; }
  to { transform: translateX(0); opacity: 1; }
}

</style>
</head>

<div id="root"></div>
